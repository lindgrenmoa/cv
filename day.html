<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My day</title>
<style>
  :root { --text:#37352f; --muted:#787774; --ring:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --text:#e6e6e4; --muted:#9b9a97; --ring:#191919; }
  }
  html, body { margin:0; background:transparent; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--text); }
  .wrap { display:flex; justify-content:center; padding:8px; }
  svg { width:100%; max-width:340px; height:auto; overflow:visible; }
  .seg { transition:opacity .2s, stroke-width .2s; cursor:default; }
  .seg.dim { opacity:.35; }
  .tick { font-size:10px; fill:var(--muted); text-anchor:middle; dominant-baseline:middle; }
  .now-name { font-size:20px; font-weight:600; fill:var(--text); text-anchor:middle; }
  .now-left { font-size:13px; fill:var(--muted); text-anchor:middle; }
  .now-next { font-size:11px; fill:var(--muted); text-anchor:middle; }
  .finger { font-size:22px; }
</style>
</head>
<body>
<div class="wrap"><svg id="clock" viewBox="0 0 320 320" role="img" aria-label="Where am I in my day"></svg></div>
<script>
// ===== Edit your day here =====
const BLOCKS = [
  { name: "Sleep",         start: "22:00", end: "06:00", color: "#A7C4E5" },
  { name: "Morning hour",  start: "06:00", end: "07:00", color: "#BCD8A8" },
  { name: "Work",          start: "07:00", end: "11:00", color: "#7FA3AD" },
  { name: "Lunch",         start: "11:00", end: "12:00", color: "#9EC284" },
  { name: "Studying",      start: "12:00", end: "16:00", color: "#B87C9B" },
  { name: "Gym",           start: "16:00", end: "18:00", color: "#F2CF5B" },
  { name: "Dinner",        start: "18:00", end: "19:00", color: "#E8B98A" },
  { name: "Creativity",    start: "19:00", end: "21:00", color: "#E9B8BE" },
  { name: "Buffer",        start: "21:00", end: "22:00", color: "#D9D9D6" },
];
// ==============================

const NS = "http://www.w3.org/2000/svg";
const C = 160, R = 118, W = 34;
const svg = document.getElementById("clock");
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const blocks = BLOCKS.map(b => {
  const s = toMin(b.start); let e = toMin(b.end); if (e <= s) e += 1440;
  return { ...b, s, e, dur: e - s };
});
const pt = (min, r) => {
  const a = (min / 1440) * 2 * Math.PI - Math.PI / 2;
  return [C + r * Math.cos(a), C + r * Math.sin(a)];
};
const el = (tag, attrs, parent = svg) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n); return n;
};

// segments
const segs = blocks.map(b => {
  const [x1, y1] = pt(b.s, R), [x2, y2] = pt(b.e, R);
  const large = b.dur > 720 ? 1 : 0;
  const p = el("path", {
    d: `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}`,
    fill: "none", stroke: b.color, "stroke-width": W, class: "seg"
  });
  const t = document.createElementNS(NS, "title");
  t.textContent = `${b.name} · ${b.start}–${b.end}`;
  p.appendChild(t);
  return p;
});
// thin separators between blocks
blocks.forEach(b => {
  const [x1, y1] = pt(b.s, R - W / 2 - 1), [x2, y2] = pt(b.s, R + W / 2 + 1);
  el("line", { x1, y1, x2, y2, stroke: "var(--ring)", "stroke-width": 2 });
});
// hour labels
[0, 3, 6, 9, 12, 15, 18, 21].forEach(h => {
  const [x, y] = pt(h * 60, R + W / 2 + 12);
  el("text", { x, y, class: "tick" }).textContent = String(h).padStart(2, "0");
});

const hand = el("text", { class: "finger", "text-anchor": "middle", "dominant-baseline": "middle" });
hand.textContent = "☝️";
const nameT = el("text", { x: C, y: C - 6, class: "now-name" });
const leftT = el("text", { x: C, y: C + 14, class: "now-left" });
const nextT = el("text", { x: C, y: C + 32, class: "now-next" });

function fmt(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (h && mm) return `${h} h ${mm} min`;
  return h ? `${h} h` : `${mm} min`;
}

function tick() {
  const d = new Date();
  const now = d.getHours() * 60 + d.getMinutes();
  let cur = -1, off = 0;
  blocks.forEach((b, i) => {
    const o = (now - b.s + 1440) % 1440;
    if (o < b.dur && cur < 0) { cur = i; off = o; }
  });
  segs.forEach((s, i) => {
    s.classList.toggle("dim", i !== cur);
    s.setAttribute("stroke-width", i === cur ? W + 8 : W);
  });
  const [hx, hy] = pt(now, R - W / 2 - 16);
  hand.setAttribute("x", hx); hand.setAttribute("y", hy);
  hand.setAttribute("transform", `rotate(${(now / 1440) * 360} ${hx} ${hy})`);
  if (cur < 0) { nameT.textContent = "Free time"; leftT.textContent = ""; nextT.textContent = ""; return; }
  const b = blocks[cur];
  const nextB = blocks[(cur + 1) % blocks.length];
  nameT.textContent = b.name;
  leftT.textContent = `${fmt(b.dur - off)} left`;
  nextT.textContent = `Next: ${nextB.name} at ${nextB.start}`;
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
